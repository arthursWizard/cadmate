name: release

# Push a tag such as v0.2.0 on main to release that version (docs/releasing.md):
# the tests run, the stable branch fast-forwards to the tag (that is what cadmate@cadmate installs),
# and a GitHub release is made. PyPI publishing runs only when the repo variable PUBLISH_PYPI is "true".
# Before tagging, bump __version__ in src/cadmate/__init__.py; the tag must be v + that version.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/cadmate/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match cadmate $version in src/cadmate/__init__.py"
            exit 1
          fi
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - name: Check the wheel from a clean environment
        run: |
          uvx --isolated --from dist/*.whl cadmate --version
          ls "$(uvx --isolated --from dist/*.whl cadmate skills-path)/cadmate-project/SKILL.md"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Move stable to the tagged commit. A plain push only fast-forwards, so this fails, rather than rewriting
  # stable, if the tag isn't ahead of it. The tag must be on main so stable never holds unmerged work.
  promote-stable:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main; tag a commit that has been merged to main"
            exit 1
          fi
      - name: Fast-forward stable
        run: git push origin "$GITHUB_SHA:refs/heads/stable"

  publish:
    needs: promote-stable
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    # PyPI trusted publishing: PyPI trusts this workflow in this repo, so no token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/p/cadmate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [promote-stable, publish]
    # Run after publish when PyPI is on, and without it when PyPI is off (publish skipped).
    if: ${{ !cancelled() && needs.promote-stable.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
