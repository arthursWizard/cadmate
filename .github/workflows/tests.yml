name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The whole suite, without KiCad or FreeCAD, on each OS cadmate claims to support.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q -rs

  # The kicad-cli commands cadmate runs, against a real KiCad 10 (Linux, from KiCad's own PPA).
  kicad-cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest -q -rs tests/test_kicad_cli.py tests/test_apps.py
        env:
          CADMATE_REQUIRE_KICAD: "1"

  # The tests that build and check models with a real FreeCAD (conda-forge's build: headless, no display needed).
  freecad:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: freecad
          create-args: freecad>=1.1 scipy  # the enclosure check uses scipy; FreeCAD's own installers bundle it, conda-forge's freecad doesn't
          cache-environment: true
      - name: Find freecadcmd
        run: |
          cmd=$(ls "$CONDA_PREFIX/bin/freecadcmd" "$CONDA_PREFIX/bin/FreeCADCmd" 2>/dev/null | head -1)
          "$cmd" --version
          echo "CADMATE_FREECADCMD=$cmd" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest -q -rs tests/test_enclosure.py tests/test_part.py tests/test_review.py tests/test_apps.py
        env:
          CADMATE_REQUIRE_FREECAD: "1"

  # The wheel as PyPI would ship it, run from a clean environment the way `uvx cadmate` runs it.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv build
      - name: Run the built wheel in isolation
        run: |
          whl=$(ls dist/*.whl)
          uvx --isolated --from "$whl" cadmate --version
          skills=$(uvx --isolated --from "$whl" cadmate skills-path)
          ls "$skills/cadmate-project/SKILL.md"
          uvx --isolated --from "$whl" cadmate install-skills --dest "$RUNNER_TEMP/skills"
          ls "$RUNNER_TEMP/skills/kicad-footprints/SKILL.md"
          python -m zipfile -l "$whl" | grep -q "cadmate/freecad_scripts/live_bridge.py"
