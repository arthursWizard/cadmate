[project]
name = "cadmate"
version = "0.1.0"
description = "An AI companion that bridges KiCad and FreeCAD through MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "kicad-python>=0.8,<0.9",
    "mcp>=2,<3",
]

[project.optional-dependencies]
# PNG snapshots on Windows (and on Linux without rsvg-convert). Also needs the cairo library itself.
snapshots = ["cairosvg>=2.7"]

[project.scripts]
cadmate = "cadmate.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
